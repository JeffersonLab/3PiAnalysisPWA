amplitude LOOPREAC::RealNegSign::1+S0 VecPs_3pi_refl 1 0 0  +1  -1  LOOPPOLANG LOOPPOLVAL 
amplitude LOOPREAC::ImagPosSign::1+S0 VecPs_3pi_refl 1 0 0  -1  +1  LOOPPOLANG LOOPPOLVAL 
