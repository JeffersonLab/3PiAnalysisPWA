amplitude LOOPREAC::RealPosSign::1+S+ VecPs_3pi_refl 1 +1 0  +1  +1  LOOPPOLANG LOOPPOLVAL 

amplitude LOOPREAC::ImagNegSign::1+S+ BreitWigner rho 1 3 4
