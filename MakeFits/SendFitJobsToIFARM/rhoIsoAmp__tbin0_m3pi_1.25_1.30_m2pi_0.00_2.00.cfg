# This config file generates/fits rho pi for up to spin 2 states based on amplitude analysis expansion by model by Adam Szczepaniak & Vincent Mathieu
#####################################
####    THIS IS A CONFIG FILE    ####
#####################################
##
##  Blank lines or lines beginning with a "#" are ignored.
##
##  Double colons (::) are treated like a space.
##     This is sometimes useful for grouping (for example,
##     grouping strings like "reaction::sum::amplitudeName")
##
##  All non-comment lines must begin with one of the following keywords.
##
##  (note:  <word> means necessary 
##          (word) means optional)
##
##  include       <file>
##  define        <word> (defn1) (defn2) (defn3) ...
##  fit           <fitname>
##  keyword       <keyword> <min arguments> <max arguments>
##  reaction      <reaction> <particle1> <particle2> (particle3) ...
##  data          <reaction> <class> (arg1) (arg2) (arg3) ...
##  genmc         <reaction> <class> (arg1) (arg2) (arg3) ...
##  accmc         <reaction> <class> (arg1) (arg2) (arg3) ...
##  normintfile   <reaction> <file>
##  sum           <reaction> <sum> (sum2) (sum3) ...
##  amplitude     <reaction> <sum> <amp> <class> (arg1) (arg2) ([par]) ... 
##  initialize    <reaction> <sum> <amp> <"events"/"polar"/"cartesian">
##                  <value1> <value2> ("fixed"/"real")
##  scale         <reaction> <sum> <amp> <value or [parameter]>
##  constrain     <reaction1> <sum1> <amp1> <reaction2> <sum2> <amp2> ...
##  permute       <reaction> <sum> <amp> <index1> <index2> ...
##  parameter     <par> <value> ("fixed"/"bounded"/"gaussian") 
##                  (lower/central) (upper/error)
##    DEPRECATED:
##  datafile      <reaction> <file> (file2) (file3) ...
##  genmcfile     <reaction> <file> (file2) (file3) ...
##  accmcfile     <reaction> <file> (file2) (file3) ...
##
#####################################

#####################################
# GLOBAL VARIABLES
#####################################

# Beam polarization definitions
define polVal_00 0.3519
define polVal_45 0.3374
define polVal_90 0.3303
define polVal_135 0.3375

define polAngle_00 0.0
define polAngle_45 45.0
define polAngle_90 90.0
define polAngle_135 135.0


# useful masses and widths
parameter deltaMass 1.232 fixed
parameter deltaWidth 0.117 fixed
parameter rhoMass 0.775 
parameter rhoWidth 0.147 
define delta [deltaMass] [deltaWidth]
define rho [rhoMass] [rhoWidth]




define UVpart Pi+%a Pi-%a Pi-%b
define LVpart Proton Pi+%b


fit fit_rhoIsoAmp_tbin0_m3pi_1.25_1.30_m2pi_0.00_2.00



#####################################                                                                                                                                                                        
# LOOP STATEMENTS                                                                                                                                                                                          
#####################################

loop LOOPREAC rhoIsoPi_00 rhoIsoPi_45 rhoIsoPi_90 rhoIsoPi_135

loop NIFILE tbin0_m3pi_1.25_1.30_m2pi_0.00_2.00_rhoIsoPi_00.ni tbin0_m3pi_1.25_1.30_m2pi_0.00_2.00_rhoIsoPi_45.ni tbin0_m3pi_1.25_1.30_m2pi_0.00_2.00_rhoIsoPi_90.ni tbin0_m3pi_1.25_1.30_m2pi_0.00_2.00_rhoIsoPi_135.ni

normintfile LOOPREAC NIFILE
#input

						           
loop LOOPDATA  /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_prompt_PARA_0.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_prompt_PERP_45.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_prompt_PERP_90.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_prompt_PARA_135.root
loop LOOPBG    /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_sideband_PARA_0.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_sideband_PERP_45.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_sideband_PERP_90.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/data_sideband_PARA_135.root

loop LOOPACCMC /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_acc_PARA_0.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_acc_PERP_45.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_acc_PERP_90.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_acc_PARA_135.root
loop LOOPGENMC /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_thrown.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_thrown.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_thrown.root /work/halld/home/ilbelov/MakeFits/SendFitJobsToIFARM/mcphsp_thrown.root



loop LOOPSCALE [parScale00] [parScale45] [parScale90] [parScale135] 
loop LOOPPOLANG polAngle_00 polAngle_45 polAngle_90 polAngle_135
loop LOOPPOLVAL polVal_00 polVal_45 polVal_90 polVal_135 



#####################################
# SETUP INPUT, REACTIONS, SUMS
#####################################


reaction LOOPREAC Beam Proton Pi- Pi- Pi+%a Pi+%b 


genmc LOOPREAC ROOTDataReader LOOPGENMC kin
accmc LOOPREAC ROOTDataReader LOOPACCMC kin
data  LOOPREAC ROOTDataReader LOOPDATA  kin
bkgnd LOOPREAC ROOTDataReader LOOPBG    kin



sum LOOPREAC ImagNegSign
sum LOOPREAC RealNegSign
sum LOOPREAC ImagPosSign
sum LOOPREAC RealPosSign  
sum LOOPREAC UniBG




#####################################
# DEFINE AMPLITUDES 
#####################################

#The VP decay amplitudes in reflectivity basis (usually written as Zim) are computed in the VecPs_3pi_refl.cc routine with the following inputs:
# argument 1 : spin (J)
# argument 2 : spin_proj (m) 
# argument 3 : partial wave (L)
# argument 4 : real (+1) or imaginary (-1) part
# argument 5 : 1 + (+1/-1) * P_gamma
#The rest arguments are optional and always represent strings
# argument 6 : polarization type (string)
# argument 7 : polarization fraction (string)
# argument 8-11: may be dalitz parameters for a two-body vector decay


# Amplitude naming convention: [spin parity][L][spin_proj][refl]
#	[refl] = p or m
#	[spin parity] = 0-, 1+, 1-, 2+, 2-, etc.
#	[spin_proj] = -,0,+ //m2, m1, 0, p1, p2
#	[L] = S,P,D,F, etc.

#############################################################
#amplitude rhoIsoPi::sum_name::amp_name
#VecPs_3pi_refl(J,m,L,Re/Im,sign,angle,fraction,dalitz)


######################### Uniform background ##################################

amplitude LOOPREAC::UniBG::Flat Uniform

###############################################################################



############################ spin 0 parity -1 ##################################

amplitude LOOPREAC::ImagNegSign::0-P VecPs_3pi_refl 0 0 1 -1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::RealNegSign::0-P VecPs_3pi_refl 0 0 1 +1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImagPosSign::0-P VecPs_3pi_refl 0 0 1 -1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::RealPosSign::0-P VecPs_3pi_refl 0 0 1 +1 +1 LOOPPOLANG LOOPPOLVAL

amplitude LOOPREAC::ImagNegSign::0-P BreitWigner rho 1 3 4
amplitude LOOPREAC::RealNegSign::0-P BreitWigner rho 1 3 4
amplitude LOOPREAC::ImagPosSign::0-P BreitWigner rho 1 3 4
amplitude LOOPREAC::RealPosSign::0-P BreitWigner rho 1 3 4




############################ spin 1 parity +1 ##################################

amplitude LOOPREAC::ImagNegSign::1+S- VecPs_3pi_refl 1 -1 0  -1  -1  LOOPPOLANG LOOPPOLVAL 
amplitude LOOPREAC::RealNegSign::1+S- VecPs_3pi_refl 1 -1 0  +1  -1  LOOPPOLANG LOOPPOLVAL 
