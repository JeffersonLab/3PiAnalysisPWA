#####################################
###     THIS IS A CONFIG FILE     ###
#####################################



#####################################
###  GLOBAL VARIABLES                
#####################################

# Beam polarization will be extracted from the data trees


# Used masses and widths
parameter deltaMass 1.225 fixed
parameter deltaWidth 0.110 fixed
parameter rhoMass 0.775 fixed
parameter rhoWidth 0.147 fixed
parameter f2Mass 1.275 fixed
parameter f2Width 0.187 fixed

define delta [deltaMass] [deltaWidth]
define rho [rhoMass] [rhoWidth]
define f2 [f2Mass] [f2Width]


fit fit_3PiDelta_$SUBRANGE



#####################################
###  LOOP STATEMENTS                 
#####################################

loop LOOPREAC 3PiDelta_Spring2017 3PiDelta_Spring2018 3PiDelta_Fall2018

loop NIFILE 3PiDelta_Spring2017__$SUBRANGE.ni 3PiDelta_Spring2018__$SUBRANGE.ni 3PiDelta_Fall2018__$SUBRANGE.ni

normintfile LOOPREAC NIFILE
#input



loop LOOPDATA $PATH/data_prompt_30274_31057.root $PATH/data_prompt_40856_42559.root $PATH/data_prompt_50685_51768.root

loop LOOPBG $PATH/data_sideband_30274_31057.root $PATH/data_sideband_40856_42559.root $PATH/data_sideband_50685_51768.root

loop LOOPACCMC $PATH/mcphsp_acc_30274_31057.root $PATH/mcphsp_acc_40856_42559.root $PATH/mcphsp_acc_50685_51768.root

loop LOOPGENMC $PATH/mcphsp_thrown_30274_31057.root $PATH/mcphsp_thrown_40856_42559.root $PATH/mcphsp_thrown_50685_51768.root

loop LOOPSCALE [parScale_Spring2017] [parScale_Spring2018] [parScale_Fall2018]



#####################################
###  SETUP INPUT, REACTIONS, SUMS    
#####################################

reaction LOOPREAC Beam Proton Pi- Pi- Pi+%a Pi+%b

genmc LOOPREAC ROOTDataReader LOOPGENMC kin
accmc LOOPREAC ROOTDataReader LOOPACCMC kin
data  LOOPREAC ROOTDataReader LOOPDATA  kin
bkgnd LOOPREAC ROOTDataReader LOOPBG    kin


sum LOOPREAC ImagNegSign
sum LOOPREAC RealNegSign
sum LOOPREAC ImagPosSign
sum LOOPREAC RealPosSign
sum LOOPREAC UniBG



#####################################
# DEFINE AMPLITUDES
#####################################

#The decay amplitudes in reflectivity basis (usually written as Zim) are computed in the Iso_ps_refl.cc routine with the following inputs:
# argument 0 : isobar spin (S)
# argument 1 : spin (J)
# argument 2 : spin_proj (m)
# argument 3 : partial wave (L)
# argument 4 : real (+1) or imaginary (-1) part
# argument 5 : 1 + (+1/-1) * P_gamma
#The rest arguments are optional and always represent strings
# argument 6 : polarization type (string)
# argument 7 : polarization fraction (string)
# argument 8-11: may be dalitz parameters for a two-body vector decay

# Amplitude naming convention: [spin parity][L][spin_proj][refl]
#       [refl] = p or m
#       [spin parity] = 0-, 1+, 1-, 2+, 2-, etc.
#       [spin_proj] = -,0,+ //m2, m1, 0, p1, p2
#       [L] = S,P,D,F, etc.

#############################################################
#amplitude 3PiDelta::sum_name::amp_name
#Iso_ps_refl(J,m,L,Re/Im,sign,angle,fraction,dalitz)



