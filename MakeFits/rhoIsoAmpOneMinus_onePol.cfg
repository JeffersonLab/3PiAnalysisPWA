# This config file generates/fits rho pi for up to spin 2 states based on amplitude analysis expansion by model by Adam Szczepaniak & Vincent Mathieu
#####################################
####    THIS IS A CONFIG FILE    ####
#####################################
##
##  Blank lines or lines beginning with a "#" are ignored.
##
##  Double colons (::) are treated like a space.
##     This is sometimes useful for grouping (for example,
##     grouping strings like "reaction::sum::amplitudeName")
##
##  All non-comment lines must begin with one of the following keywords.
##
##  (note:  <word> means necessary 
##          (word) means optional)
##
##  include       <file>
##  define        <word> (defn1) (defn2) (defn3) ...
##  fit           <fitname>
##  keyword       <keyword> <min arguments> <max arguments>
##  reaction      <reaction> <particle1> <particle2> (particle3) ...
##  data          <reaction> <class> (arg1) (arg2) (arg3) ...
##  genmc         <reaction> <class> (arg1) (arg2) (arg3) ...
##  accmc         <reaction> <class> (arg1) (arg2) (arg3) ...
##  normintfile   <reaction> <file>
##  sum           <reaction> <sum> (sum2) (sum3) ...
##  amplitude     <reaction> <sum> <amp> <class> (arg1) (arg2) ([par]) ... 
##  initialize    <reaction> <sum> <amp> <"events"/"polar"/"cartesian">
##                  <value1> <value2> ("fixed"/"real")
##  scale         <reaction> <sum> <amp> <value or [parameter]>
##  constrain     <reaction1> <sum1> <amp1> <reaction2> <sum2> <amp2> ...
##  permute       <reaction> <sum> <amp> <index1> <index2> ...
##  parameter     <par> <value> ("fixed"/"bounded"/"gaussian") 
##                  (lower/central) (upper/error)
##    DEPRECATED:
##  datafile      <reaction> <file> (file2) (file3) ...
##  genmcfile     <reaction> <file> (file2) (file3) ...
##  accmcfile     <reaction> <file> (file2) (file3) ...
##
#####################################

#####################################
# GLOBAL VARIABLES
#####################################


# useful masses and widths
parameter deltaMass 1.232 fixed
parameter deltaWidth 0.117 fixed
define delta [deltaMass] [deltaWidth]


# Beam polarization definitions
define beamconfig beam.config
define polFrac 0.3519
define polAngle 0.0


# phase offset parameter
parameter phase1-P0 0
parameter phase1+S0 0 fixed
parameter phase1+D0 0 


define UVpart Pi+%a Pi-%a Pi-%b
define LVpart Proton Pi+%b


fit FITNAME
normintfile rhoIsoPi NIFILE


#####################################
# SETUP INPUT, REACTIONS, SUMS
#####################################

reaction rhoIsoPi Beam Pi+%a Pi+%b Pi- Pi- Proton


data  rhoIsoPi ROOTDataReader /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_prompt__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_0.root kin
bkgnd rhoIsoPi ROOTDataReader /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_sideband__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_0.root kin
accmc rhoIsoPi ROOTDataReader /work/halld/home/ilbelov/OLD/MCphspOldSpring2017/RecoTreesBestChi2/POLS/mctree_2pip2pim_best_chi2_10slopes__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_0.root kin 
genmc rhoIsoPi ROOTDataReader /work/halld/home/ilbelov/OLD/MCphspOldSpring2017/SourceTrees/throwntree_2pip2pim_10slopes__sum_30274_31057_tbin0.root kin


sum rhoIsoPi ImagNegSign RealNegSign ImagPosSign RealPosSign  




#####################################
# DEFINE AMPLITUDES 
#####################################

#The VP decay amplitudes in reflectivity basis (usually written as Zim) are computed in the VecPs_3pi_refl.cc routine with the following inputs:
# argument 1 : spin (J)
# argument 2 : spin_proj (m) 
# argument 3 : partial wave (L)
# argument 4 : real (+1) or imaginary (-1) part
# argument 5 : 1 + (+1/-1) * P_gamma
#The rest arguments are optional and always represent strings
# argument 6 : polarization type (string)
# argument 7 : polarization fraction (string)
# argument 8-11: may be dalitz parameters for a two-body vector decay


# Amplitude naming convention: [spin parity][L][spin_proj][refl]
#	[spin parity] = 0-, 1+, 1-, 2+, 2-, etc.
#	[L] = S,P,D,F, etc.
#	[spin_proj] = -,0,+ //m2, m1, 0, p1, p2
#	[refl] = p or m


#############################################################
#amplitude rhoIsoPi::sum_name::amp_name
#VecPs_3pi_refl(J,m,L,Re/Im,sign,angle,fraction,dalitz)



############################ spin 1 parity -1 ##################################

loop LoopOneMinusAmp 1-P- 1-P0 1-P+
loop LoopOneMinusM -1 0 +1

amplitude rhoIsoPi::ImagNegSign::LoopOneMinusAmp VecPs_3pi_refl 1 LoopOneMinusM 1 -1 -1 polAngle polFrac
amplitude rhoIsoPi::RealNegSign::LoopOneMinusAmp VecPs_3pi_refl 1 LoopOneMinusM 1 +1 -1 polAngle polFrac
amplitude rhoIsoPi::ImagPosSign::LoopOneMinusAmp VecPs_3pi_refl 1 LoopOneMinusM 1 -1 +1 polAngle polFrac
amplitude rhoIsoPi::RealPosSign::LoopOneMinusAmp VecPs_3pi_refl 1 LoopOneMinusM 1 +1 +1 polAngle polFrac


initialize rhoIsoPi::ImagNegSign::LoopOneMinusAmp cartesian 100 0 real
initialize rhoIsoPi::RealNegSign::LoopOneMinusAmp cartesian 100 0 real
initialize rhoIsoPi::ImagPosSign::LoopOneMinusAmp cartesian 100 0 real
initialize rhoIsoPi::RealPosSign::LoopOneMinusAmp cartesian 100 0 real

constrain rhoIsoPi::ImagNegSign::LoopOneMinusAmp rhoIsoPi::RealPosSign::LoopOneMinusAmp
constrain rhoIsoPi::RealNegSign::LoopOneMinusAmp rhoIsoPi::ImagPosSign::LoopOneMinusAmp






