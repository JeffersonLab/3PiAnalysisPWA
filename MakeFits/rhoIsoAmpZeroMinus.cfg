# This config file generates/fits rho pi for up to spin 2 states based on amplitude analysis expansion by model by Adam Szczepaniak & Vincent Mathieu
#####################################
####    THIS IS A CONFIG FILE    ####
#####################################
##
##  Blank lines or lines beginning with a "#" are ignored.
##
##  Double colons (::) are treated like a space.
##     This is sometimes useful for grouping (for example,
##     grouping strings like "reaction::sum::amplitudeName")
##
##  All non-comment lines must begin with one of the following keywords.
##
##  (note:  <word> means necessary 
##          (word) means optional)
##
##  include       <file>
##  define        <word> (defn1) (defn2) (defn3) ...
##  fit           <fitname>
##  keyword       <keyword> <min arguments> <max arguments>
##  reaction      <reaction> <particle1> <particle2> (particle3) ...
##  data          <reaction> <class> (arg1) (arg2) (arg3) ...
##  genmc         <reaction> <class> (arg1) (arg2) (arg3) ...
##  accmc         <reaction> <class> (arg1) (arg2) (arg3) ...
##  normintfile   <reaction> <file>
##  sum           <reaction> <sum> (sum2) (sum3) ...
##  amplitude     <reaction> <sum> <amp> <class> (arg1) (arg2) ([par]) ... 
##  initialize    <reaction> <sum> <amp> <"events"/"polar"/"cartesian">
##                  <value1> <value2> ("fixed"/"real")
##  scale         <reaction> <sum> <amp> <value or [parameter]>
##  constrain     <reaction1> <sum1> <amp1> <reaction2> <sum2> <amp2> ...
##  permute       <reaction> <sum> <amp> <index1> <index2> ...
##  parameter     <par> <value> ("fixed"/"bounded"/"gaussian") 
##                  (lower/central) (upper/error)
##    DEPRECATED:
##  datafile      <reaction> <file> (file2) (file3) ...
##  genmcfile     <reaction> <file> (file2) (file3) ...
##  accmcfile     <reaction> <file> (file2) (file3) ...
##
#####################################

#####################################
# GLOBAL VARIABLES
#####################################

# Beam polarization definitions
define polVal_00 0.3519
define polVal_45 0.3374
define polVal_90 0.3303
define polVal_135 0.3375

define polAngle_00 0.0
define polAngle_45 45.0
define polAngle_90 90.0
define polAngle_135 135.0


# useful masses and widths
parameter deltaMass 1.232 fixed
parameter deltaWidth 0.117 fixed
define delta [deltaMass] [deltaWidth]


# phase offset parameter
parameter phase1-P0 0
parameter phase1+S0 0 fixed
parameter phase1+D0 0 


define UVpart Pi+%a Pi-%a Pi-%b
define LVpart Proton Pi+%b


fit fit0m_allPol



#####################################                                                                                                                                                                        
# LOOP STATEMENTS                                                                                                                                                                                          
#####################################

loop LOOPREAC rhoIsoPi_00 rhoIsoPi_45 rhoIsoPi_90 rhoIsoPi_135

loop NIFILE rhoIsoPiAmpZeroMinus_00.ni rhoIsoPiAmpZeroMinus_45.ni rhoIsoPiAmpZeroMinus_90.ni rhoIsoPiAmpZeroMinus_135.ni

normintfile LOOPREAC NIFILE input


loop LOOPDATA /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_prompt__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_0.root /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_prompt__sum_30274_31057_allcuts_tbin0_m3pibintest_PERP_45.root /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_prompt__sum_30274_31057_allcuts_tbin0_m3pibintest_PERP_90.root /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_prompt__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_135.root
loop LOOPBG /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_sideband__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_0.root /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_sideband__sum_30274_31057_allcuts_tbin0_m3pibintest_PERP_45.root /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_sideband__sum_30274_31057_allcuts_tbin0_m3pibintest_PERP_90.root /work/halld/home/ilbelov/OLD/DataOldSpring2017/POLS/flattree_2pip2pim_chi2_sideband__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_135.root
loop LOOPACCMC  /work/halld/home/ilbelov/OLD/MCphspOldSpring2017/RecoTreesBestChi2/POLS/mctree_2pip2pim_best_chi2_10slopes__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_0.root /work/halld/home/ilbelov/OLD/MCphspOldSpring2017/RecoTreesBestChi2/POLS/mctree_2pip2pim_best_chi2_10slopes__sum_30274_31057_allcuts_tbin0_m3pibintest_PERP_45.root /work/halld/home/ilbelov/OLD/MCphspOldSpring2017/RecoTreesBestChi2/POLS/mctree_2pip2pim_best_chi2_10slopes__sum_30274_31057_allcuts_tbin0_m3pibintest_PERP_90.root /work/halld/home/ilbelov/OLD/MCphspOldSpring2017/RecoTreesBestChi2/POLS/mctree_2pip2pim_best_chi2_10slopes__sum_30274_31057_allcuts_tbin0_m3pibintest_PARA_135.root


