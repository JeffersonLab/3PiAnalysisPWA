#####################################
# SETUP INPUT, REACTIONS, SUMS
#####################################


reaction LOOPREAC Beam Pi+%a Pi+%b Pi- Pi- Proton


genmc LOOPREAC ROOTDataReader LOOPGENMC kin
accmc LOOPREAC ROOTDataReader LOOPACCMC kin
data  LOOPREAC ROOTDataReader LOOPDATA  kin
bkgnd LOOPREAC ROOTDataReader LOOPBG    kin



sum LOOPREAC ImagNegSign
sum LOOPREAC RealNegSign
sum LOOPREAC ImagPosSign
sum LOOPREAC RealPosSign  




#####################################
# DEFINE AMPLITUDES 
#####################################

#The VP decay amplitudes in reflectivity basis (usually written as Zim) are computed in the VecPs_3pi_refl.cc routine with the following inputs:
# argument 1 : spin (J)
# argument 2 : spin_proj (m) 
# argument 3 : partial wave (L)
# argument 4 : real (+1) or imaginary (-1) part
# argument 5 : 1 + (+1/-1) * P_gamma
#The rest arguments are optional and always represent strings
# argument 6 : polarization type (string)
# argument 7 : polarization fraction (string)
# argument 8-11: may be dalitz parameters for a two-body vector decay


# Amplitude naming convention: [spin parity][L][spin_proj][refl]
#	[refl] = p or m
#	[spin parity] = 0-, 1+, 1-, 2+, 2-, etc.
#	[spin_proj] = -,0,+ //m2, m1, 0, p1, p2
#	[L] = S,P,D,F, etc.

#############################################################
#amplitude rhoIsoPi::sum_name::amp_name
#VecPs_3pi_refl(J,m,L,Re/Im,sign,angle,fraction,dalitz)


############################ spin 0 parity -1 ##################################

define ZeroMinusAmp 0-P

amplitude LOOPREAC::ImagNegSign::ZeroMinusAmp VecPs_3pi_refl 0 0 1 -1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::RealNegSign::ZeroMinusAmp VecPs_3pi_refl 0 0 1 +1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImagPosSign::ZeroMinusAmp VecPs_3pi_refl 0 0 1 -1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::RealPosSign::ZeroMinusAmp VecPs_3pi_refl 0 0 1 +1 +1 LOOPPOLANG LOOPPOLVAL


initialize LOOPREAC::ImagNegSign::ZeroMinusAmp cartesian 100 0 real
initialize LOOPREAC::RealNegSign::ZeroMinusAmp cartesian 100 0 real
initialize LOOPREAC::ImagPosSign::ZeroMinusAmp cartesian 100 0 real
initialize LOOPREAC::RealPosSign::ZeroMinusAmp cartesian 100 0 real



#####################################
# SET CONSTRAINS 
#####################################
# Constrain same amplitudes in different incoherent sums 
constrain LOOPREAC::ImagNegSign::ZeroMinusAmp LOOPREAC::RealPosSign::ZeroMinusAmp
constrain LOOPREAC::RealNegSign::ZeroMinusAmp LOOPREAC::ImagPosSign::ZeroMinusAmp


# Constrain all other 'reactions' to the first one:
constrain rhoIsoPi_00::RealNegSign::ZeroMinusAmp LOOPREAC::RealNegSign::ZeroMinusAmp
constrain rhoIsoPi_00::ImagNegSign::ZeroMinusAmp LOOPREAC::ImagNegSign::ZeroMinusAmp
#constrain rhoIsoPi_00::RealPosSign::ZeroMinusAmp LOOPREAC::RealPosSign::ZeroMinusAmp
#constrain rhoIsoPi_00::ImagPosSign::ZeroMinusAmp LOOPREAC::ImagPosSign::ZeroMinusAmp


#####################################
# SETUP SCALING
#####################################

parameter parScale00 1.0 fixed
parameter parScale45 1.01361213939265
parameter parScale90 1.00959811985969
parameter parScale135 1.01968152203318


scale LOOPREAC::ImagNegSign::ZeroMinusAmp LOOPSCALE
scale LOOPREAC::RealNegSign::ZeroMinusAmp LOOPSCALE
scale LOOPREAC::ImagPosSign::ZeroMinusAmp LOOPSCALE
scale LOOPREAC::RealPosSign::ZeroMinusAmp LOOPSCALE
