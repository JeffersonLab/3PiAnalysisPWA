reaction Pi0PipPiMProton Beam Proton Pi0 Pi- Pi+

# polarization information -- use 100% polarization to enhance visual effect
#define polVal 1.0
#define polAngleDeg 0.0

# a string that can be used in amplitude arguments
#define polInfo polAngleDeg polVal

# resonance mass and width
define res1MassWidth 0.775 0.150 # rho mass and width
# define resL 2 # D wave
# define resM 0

define res2MassWidth 1.232 0.117 # delta mass and width

# create two sums needed in the amplitude -- as long as we use
# a single reflectivity, then two sums are sufficient
# sum pi0piM reZ
# sum pi0piM imZ


# kinematic/angular dependence given by Zlm (GlueX-doc 4094)
# (choose one of the two pairs below and comment out the other)

# this pair is for positive reflectivity
# amplitude pi0piM::reZ::resAmp Zlm resL resM +1 +1 polInfo
# amplitude pi0piM::imZ::resAmp Zlm resL resM -1 -1 polInfo

# this pair is for negative reflectivity
# amplitude pi0piM::reZ::resAmp Zlm resL resM -1 +1 polInfo
# amplitude pi0piM::imZ::resAmp Zlm resL resM +1 -1 polInfo


# dynamical part is a Breit-Winger
# amplitude pi0piM::reZ::resAmp BreitWigner resMassWidth resL 2 3 # the two and three here should correspond to the piM and pi0
# amplitude pi0piM::imZ::resAmp BreitWigner resMassWidth resL 2 3


# initialize pi0piM::reZ::resAmp cartesian 1 0
# constrain pi0piM::reZ::resAmp pi0piM::imZ::resAmp

